<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">ESP32 DevKit v1 &#8596; INMP441 Wiring</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#555555">P2 &#8211; Edge TinyML Acoustic Event Classifier</text>

  <!-- ESP32 board -->
  <rect x="80" y="110" width="220" height="420" rx="14" fill="#1f2a24" stroke="#0d1410" stroke-width="2"/>
  <rect x="150" y="130" width="80" height="90" rx="6" fill="#3a3a3a" stroke="#111111" stroke-width="1.5"/>
  <text x="190" y="180" text-anchor="middle" font-size="12" fill="#eeeeee">ESP32-WROOM</text>
  <text x="190" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ESP32</text>
  <text x="190" y="305" text-anchor="middle" font-size="13" fill="#cfcfcf">DevKit v1</text>

  <!-- ESP32 pin pads (right edge) -->
  <g font-size="13" fill="#ffffff">
    <circle cx="300" cy="200" r="5" fill="#f2c744"/>
    <text x="288" y="196" text-anchor="end">3V3</text>

    <circle cx="300" cy="250" r="5" fill="#9a9a9a"/>
    <text x="288" y="246" text-anchor="end">GND</text>

    <circle cx="300" cy="360" r="5" fill="#3a7bd5"/>
    <text x="288" y="356" text-anchor="end">GPIO26</text>

    <circle cx="300" cy="410" r="5" fill="#e3e3e3"/>
    <text x="288" y="406" text-anchor="end">GPIO25</text>

    <circle cx="300" cy="460" r="5" fill="#e07b39"/>
    <text x="288" y="456" text-anchor="end">GPIO33</text>
  </g>

  <!-- INMP441 board -->
  <rect x="660" y="150" width="220" height="300" rx="14" fill="#0d1116" stroke="#000000" stroke-width="2"/>
  <circle cx="770" cy="230" r="28" fill="#2c2c2c" stroke="#000000" stroke-width="1.5"/>
  <circle cx="770" cy="230" r="10" fill="#111111"/>
  <text x="770" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">INMP441</text>
  <text x="770" y="303" text-anchor="middle" font-size="12" fill="#cfcfcf">I2S MEMS Mic</text>

  <!-- INMP441 pin pads (left edge) -->
  <g font-size="13" fill="#ffffff">
    <circle cx="660" cy="200" r="5" fill="#f2c744"/>
    <text x="672" y="196" text-anchor="start">VDD</text>

    <circle cx="660" cy="250" r="5" fill="#9a9a9a"/>
    <text x="672" y="246" text-anchor="start">GND</text>

    <circle cx="660" cy="330" r="5" fill="#3a7bd5"/>
    <text x="672" y="326" text-anchor="start">SCK</text>

    <circle cx="660" cy="370" r="5" fill="#e3e3e3"/>
    <text x="672" y="366" text-anchor="start">WS</text>

    <circle cx="660" cy="410" r="5" fill="#e07b39"/>
    <text x="672" y="406" text-anchor="start">SD</text>

    <circle cx="660" cy="440" r="5" fill="#9a9a9a"/>
    <text x="672" y="436" text-anchor="start">L/R</text>
  </g>

  <!-- Wires -->
  <!-- 3V3 -> VDD (yellow/power) -->
  <path d="M300,200 C420,200 540,200 660,200" stroke="#c99a00" stroke-width="3" fill="none"/>
  <text x="480" y="192" text-anchor="middle" font-size="12" fill="#c99a00">3V3 power</text>

  <!-- GND -> GND (grey) -->
  <path d="M300,250 C420,250 540,250 660,250" stroke="#777777" stroke-width="3" fill="none"/>
  <text x="480" y="242" text-anchor="middle" font-size="12" fill="#777777">GND</text>

  <!-- GPIO26 -> SCK (blue) -->
  <path d="M300,360 C420,360 540,330 660,330" stroke="#2a5db0" stroke-width="3" fill="none"/>
  <text x="480" y="352" text-anchor="middle" font-size="12" fill="#2a5db0">GPIO26 &#8594; SCK (bit clock)</text>

  <!-- GPIO25 -> WS (light grey) -->
  <path d="M300,410 C420,410 540,370 660,370" stroke="#aaaaaa" stroke-width="3" fill="none"/>
  <text x="480" y="402" text-anchor="middle" font-size="12" fill="#888888">GPIO25 &#8594; WS (word select)</text>

  <!-- GPIO33 <- SD (orange) -->
  <path d="M300,460 C420,460 540,410 660,410" stroke="#c9631f" stroke-width="3" fill="none"/>
  <text x="480" y="452" text-anchor="middle" font-size="12" fill="#c9631f">GPIO33 &#8592; SD (audio data)</text>

  <!-- L/R -> GND (grey, routed down and back to ESP32 GND rail) -->
  <path d="M660,440 C560,500 380,500 300,250" stroke="#777777" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <text x="480" y="512" text-anchor="middle" font-size="12" fill="#777777">L/R &#8594; GND (selects left channel)</text>

  <!-- Legend -->
  <g font-size="12" fill="#333333">
    <text x="80" y="580" font-weight="bold">Legend:</text>
    <circle cx="150" cy="576" r="5" fill="#c99a00"/><text x="160" y="580">Power (3.3V)</text>
    <circle cx="280" cy="576" r="5" fill="#777777"/><text x="290" y="580">Ground</text>
    <circle cx="380" cy="576" r="5" fill="#2a5db0"/><text x="390" y="580">I2S Clock/Data</text>
    <circle cx="560" cy="576" r="5" fill="#c9631f"/><text x="570" y="580">Audio Data (SD)</text>
  </g>

  <text x="480" y="605" text-anchor="middle" font-size="11" fill="#888888">Diagram created for repository documentation (not exported from Fritzing)</text>
</svg>

